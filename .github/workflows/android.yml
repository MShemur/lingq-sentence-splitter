name: Build Android app

# Builds the APK on every change of the app and publishes it as a GitHub release v1.<run number>.
# The app checks the latest release and offers the update.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write   # create the release

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_B64 is missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          mkdir -p android/app/signing
          echo "$KEYSTORE_B64" | base64 -d > android/app/signing/release.p12

      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "lingq-fix-$VERSION_NAME.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lingq-fix-apk
          path: lingq-fix-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "lingq-fix-$VERSION_NAME.apk" \
            --title "LingQ Fix $VERSION_NAME" \
            --notes "$(git log -1 --pretty=%s)"
