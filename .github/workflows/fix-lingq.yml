name: Fix LingQ sentences

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Ссылка на курс или урок LingQ (для restore: путь runs/<время>/backup/<id>.json; для delete-backups: любой текст)"
        required: true
        type: string
      mode:
        description: "dry-run = только отчёт, apply = записать в LingQ, restore = вернуть урок из копии, delete-backups = удалить все копии"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
          - restore
          - delete-backups

permissions:
  contents: write   # apply commits the run's backups to runs/ (kept 3 days) so lessons can be restored

concurrency:
  group: lingq-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LINGQ_API_KEY: ${{ secrets.LINGQ_API_KEY }}
      TARGET: ${{ inputs.target }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Run
        shell: bash
        run: |
          set -o pipefail
          if [ -z "$LINGQ_API_KEY" ]; then
            echo "::error::Secret LINGQ_API_KEY is not set (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          case "$MODE" in
            delete-backups) echo "Удаляю все копии в runs/"; rm -rf runs ;;
            dry-run) python3 lingq_fix_splits.py "$TARGET" ;;
            apply)   python3 lingq_fix_splits.py "$TARGET" --apply ;;
            restore) python3 lingq_fix_splits.py --restore "$TARGET" ;;
          esac 2>&1 | tee output.txt

      - name: Report
        if: always()
        shell: bash
        run: |
          R=$(ls -d runs/*/ 2>/dev/null | sort | tail -1)
          if [ -n "$R" ] && [ -f "$R/report.md" ] && [ "$MODE" != restore ]; then
            head -c 900000 "$R/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            { echo "## $MODE: \`$TARGET\`"; echo; echo '```'; head -c 60000 output.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report and backup
        if: always() && (inputs.mode == 'dry-run' || inputs.mode == 'apply')
        uses: actions/upload-artifact@v4
        with:
          name: lingq-run
          path: runs/
          if-no-files-found: ignore

      - name: Save backups to repository, drop copies older than 3 days
        if: success()
        shell: bash
        run: |
          # runs/<YYYYmmdd-HHMMSS>/ older than 3 days are removed (they stay only in git history)
          LIMIT=$(date -u -d '3 days ago' +%Y%m%d-%H%M%S)
          for d in runs/*/; do
            [ -d "$d" ] || continue
            s=$(basename "$d")
            if [[ "$s" < "$LIMIT" ]]; then echo "Удаляю старую копию $s"; rm -rf "$d"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # dry-run reports are not kept; apply runs carry the backups
          if [ "$MODE" = apply ]; then git add -A runs/; else git add -u runs/ 2>/dev/null || true; fi
          git diff --cached --quiet && exit 0
          case "$MODE" in
            apply) git commit -m "LingQ apply run: $TARGET" ;;
            delete-backups) git commit -m "Delete all LingQ backups" ;;
            *) git commit -m "Drop LingQ backups older than 3 days" ;;
          esac
          git push
